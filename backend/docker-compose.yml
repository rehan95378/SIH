services:
  postgres:
    image: postgres:16-alpine
    container_name: crime-network-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: crime_network
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - crime-network-postgres-data:/var/lib/postgresql/data

volumes:
  crime-network-postgres-data:
